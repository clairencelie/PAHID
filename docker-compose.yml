services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pahid_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - pahid_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: pahid_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pahid_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pahid_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pahid
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: pahid
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - pahid_db_data:/var/lib/mysql
    networks:
      - pahid_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pahid_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    networks:
      - pahid_network
    depends_on:
      - db

  node:
    image: node:20-alpine
    container_name: pahid_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - pahid_network
    profiles:
      - tools

networks:
  pahid_network:
    driver: bridge

volumes:
  pahid_db_data:
    driver: local
